<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vendas do contato</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      /* ==================================================================
         Painel de vendas — UI de produto embutida, não página de marketing.

         Três decisões que guiam o resto do arquivo:

         1. O painel roda num drawer de 380px na barra lateral direita do
            Novus CRM, e esse drawer já exibe o nome do plugin no topo.
            Repetir a marca aqui seria ruído, então o painel começa direto
            no contato.
         2. Tipografia do sistema, uma família só, para o painel parecer parte
            do host em vez de uma página estrangeira dentro dele. Número usa
            `font-variant-numeric: tabular-nums`, que dá largura de dígito
            constante para as colunas alinharem, sem o visual de terminal que
            uma fonte monoespaçada traria.
         3. Altura automática. Nada de `100vh` aqui dentro: quem controla a
            rolagem é o drawer do host, e esticar o painel só produz vazio.
         ================================================================== */

      :root {
        color-scheme: light dark;

        /* Azul do C-Plus 5. Único acento da interface, reservado para o que
           é interativo (foco, ação). Cor de status é escala à parte. */
        --azul: #0030ff;
        --azul-veu: #eef1ff;

        --tinta: #12141a;
        --tinta-media: #4b5261;
        --tinta-fraca: #79808f;

        --fundo: #ffffff;
        --papel: #f6f7f9;
        --linha: #e4e7ec;

        --verde: #0a7a4d;
        --ambar: #96591a;
        --vermelho: #bf2438;
        --cinza: #6c7280;

        /* Um raio só, em tudo. */
        --raio: 6px;

        --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --azul: #6b86ff;
          --azul-veu: #191f36;

          --tinta: #eceef4;
          --tinta-media: #a5acbd;
          --tinta-fraca: #79808f;

          --fundo: #0f1117;
          --papel: #161922;
          --linha: #262b38;

          --verde: #3fc38a;
          --ambar: #d9a03c;
          --vermelho: #ff7286;
          --cinza: #868d9c;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--fundo);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      .painel {
        max-width: 560px;
        margin: 0 auto;
      }

      /* --- Contato ---------------------------------------------------- */

      .contato {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 16px;
        background: var(--fundo);
        border-bottom: 1px solid var(--linha);
      }

      .contato__nome {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .contato__codigo {
        flex: none;
        padding: 2px 7px;
        border-radius: var(--raio);
        background: var(--papel);
        color: var(--tinta-media);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }

      /* Enquanto o código não chegou, o chip vira um bloco cinza do mesmo
         tamanho — em vez de "…", que parece defeito. */
      .contato__codigo[data-carregando] {
        width: 44px;
        color: transparent;
        background: var(--linha);
      }

      /* --- Busca ------------------------------------------------------- */

      .busca {
        position: relative;
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--linha);
      }

      .busca__icone {
        position: absolute;
        left: 27px;
        width: 14px;
        height: 14px;
        color: var(--tinta-fraca);
        pointer-events: none;
      }

      .busca__campo {
        width: 100%;
        padding: 8px 10px 8px 31px;
        border: 1px solid var(--linha);
        border-radius: var(--raio);
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 13px;
        transition:
          border-color 0.12s ease,
          box-shadow 0.12s ease,
          background 0.12s ease;
      }

      .busca__campo::placeholder {
        color: var(--tinta-fraca);
      }

      .busca__campo:focus {
        outline: none;
        background: var(--fundo);
        border-color: var(--azul);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--azul) 16%, transparent);
      }

      /* --- Linha de contexto ------------------------------------------- */

      .contexto {
        padding: 9px 16px;
        border-bottom: 1px solid var(--linha);
        font-size: 12px;
        color: var(--tinta-fraca);
      }

      .contexto strong {
        color: var(--tinta);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* --- Lista de vendas --------------------------------------------- */

      .lista {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .venda {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1px 12px;
        padding: 11px 16px;
        border-bottom: 1px solid var(--linha);
      }

      .venda__numero {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--tinta-media);
      }

      .venda__valor {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        text-align: right;
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .venda__meta {
        grid-column: 1;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--tinta-fraca);
      }

      /* Status: só o rótulo, colorido. A cor reforça, o texto informa —
         quem não distingue a cor continua lendo "Cancelada". */
      .venda__status {
        color: var(--cor-status, var(--cinza));
        font-weight: 500;
      }

      .venda__itens {
        grid-column: 1 / -1;
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--tinta-media);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* --- Carregando --------------------------------------------------- */

      .esqueleto__linha {
        display: grid;
        gap: 7px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--linha);
      }

      .barra {
        height: 8px;
        border-radius: 3px;
        background: var(--linha);
      }

      .barra--curta { width: 32%; }
      .barra--media { width: 58%; }

      @media (prefers-reduced-motion: no-preference) {
        .barra {
          animation: pulsar 1.4s ease-in-out infinite;
        }
        .esqueleto__linha:nth-child(2) .barra { animation-delay: 0.1s; }
        .esqueleto__linha:nth-child(3) .barra { animation-delay: 0.2s; }
        .esqueleto__linha:nth-child(4) .barra { animation-delay: 0.3s; }
      }

      @keyframes pulsar {
        50% { opacity: 0.45; }
      }

      /* --- Avisos ------------------------------------------------------- */

      .aviso {
        padding: 44px 24px 52px;
        text-align: center;
      }

      .aviso__titulo {
        margin: 0 0 5px;
        font-size: 13px;
        font-weight: 600;
      }

      .aviso__texto {
        margin: 0 auto;
        max-width: 34ch;
        font-size: 12.5px;
        color: var(--tinta-fraca);
      }

      .aviso__acao {
        margin-top: 14px;
      }

      /* --- Botões e paginação -------------------------------------------- */

      .botao {
        padding: 6px 12px;
        border: 1px solid var(--linha);
        border-radius: var(--raio);
        background: var(--fundo);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          color 0.12s ease,
          background 0.12s ease;
      }

      .botao:hover:not(:disabled) {
        border-color: var(--azul);
        color: var(--azul);
        background: var(--azul-veu);
      }

      .botao:active:not(:disabled) {
        transform: translateY(1px);
      }

      .botao:focus-visible {
        outline: 2px solid var(--azul);
        outline-offset: 2px;
      }

      .botao:disabled {
        color: var(--tinta-fraca);
        cursor: default;
      }

      .paginacao {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
      }

      .paginacao__posicao {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--tinta-fraca);
      }
    </style>
  </head>

  <body>
    <div class="painel">
      <header class="contato" data-secao="contato" hidden>
        <span class="contato__nome" data-campo="nomeContato"></span>
        <span class="contato__codigo" data-campo="codigoPessoa"></span>
      </header>

      <div class="busca" data-secao="busca" hidden>
        <!-- Ícone: Phosphor Icons (MIT), regular/magnifying-glass. -->
        <svg class="busca__icone" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path
            d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
          />
        </svg>
        <input
          class="busca__campo"
          data-campo="busca"
          type="search"
          autocomplete="off"
          placeholder="Número da venda ou produto"
          aria-label="Buscar vendas do contato"
        />
      </div>

      <p class="contexto" data-secao="contexto" hidden data-campo="contexto"></p>

      <ul class="lista" data-secao="lista" hidden></ul>

      <div data-secao="esqueleto" hidden aria-hidden="true">
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
      </div>

      <div class="aviso" data-secao="aviso" aria-live="polite" hidden>
        <p class="aviso__titulo" data-campo="avisoTitulo"></p>
        <p class="aviso__texto" data-campo="avisoTexto"></p>
        <button class="botao aviso__acao" data-acao="repetir" type="button" hidden>
          Tentar de novo
        </button>
      </div>

      <nav class="paginacao" data-secao="paginacao" hidden aria-label="Paginação">
        <button class="botao" data-acao="anterior" type="button">Anterior</button>
        <span class="paginacao__posicao" data-campo="posicao"></span>
        <button class="botao" data-acao="proxima" type="button">Próxima</button>
      </nav>
    </div>

    <template data-modelo="venda">
      <li class="venda">
        <span class="venda__numero" data-campo="numero"></span>
        <span class="venda__valor" data-campo="valor"></span>
        <span class="venda__meta">
          <span data-campo="data"></span>
          <span aria-hidden="true">·</span>
          <span class="venda__status" data-campo="status"></span>
        </span>
        <p class="venda__itens" data-campo="itens"></p>
      </li>
    </template>

    <script src="plugin.js"></script>
  </body>
</html>
