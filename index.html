<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vendas do contato — C-Plus 5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Único recurso externo do plugin. Se a fonte não carregar, a pilha de
         fallback abaixo mantém o painel legível. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ==================================================================
         Design system C-Plus 5
         Azul #0030FF como espinha estrutural, hairlines no lugar de sombras,
         numerais tabulares. O painel vive num iframe estreito (~380px) da
         barra lateral, mas também abre em página inteira — daí o
         `max-width` no container.
         ================================================================== */

      :root {
        color-scheme: light dark;

        --azul: #0030ff;
        --azul-forte: #0026cc;
        --azul-veu: #eef1ff;

        --tinta: #0b0d14;
        --tinta-media: #4a5163;
        --tinta-fraca: #767d90;

        --fundo: #ffffff;
        --papel: #f7f8fb;
        --linha: #e5e8f0;

        --verde: #067a4b;
        --ambar: #a35c00;
        --vermelho: #c0223b;
        --cinza: #6b7183;

        --raio: 8px;
        --raio-mini: 5px;

        --sans: "IBM Plex Sans", ui-sans-serif, "Segoe UI", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --azul: #5878ff;
          --azul-forte: #7a92ff;
          --azul-veu: #161c33;

          --tinta: #eef0f6;
          --tinta-media: #a8afc2;
          --tinta-fraca: #7b8296;

          --fundo: #0b0d14;
          --papel: #12141d;
          --linha: #232838;

          --verde: #46c78e;
          --ambar: #e0a63c;
          --vermelho: #ff7a8e;
          --cinza: #8a90a3;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--fundo);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      .painel {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* --- Cabeçalho ------------------------------------------------- */

      .cabecalho {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 14px 16px 12px;
        background: var(--fundo);
        border-bottom: 1px solid var(--linha);
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 7px;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--tinta-fraca);
      }

      .marca__selo {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--azul);
      }

      .contato {
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .contato__nome {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .contato__codigo {
        flex: none;
        padding: 2px 6px;
        border-radius: var(--raio-mini);
        background: var(--azul-veu);
        color: var(--azul);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
      }

      /* --- Busca ------------------------------------------------------ */

      .controles {
        padding: 12px 16px;
        border-bottom: 1px solid var(--linha);
      }

      .busca {
        position: relative;
        display: flex;
        align-items: center;
      }

      .busca__icone {
        position: absolute;
        left: 10px;
        width: 14px;
        height: 14px;
        color: var(--tinta-fraca);
        pointer-events: none;
      }

      .busca__campo {
        width: 100%;
        padding: 9px 10px 9px 30px;
        border: 1px solid var(--linha);
        border-radius: var(--raio);
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 13px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .busca__campo::placeholder {
        color: var(--tinta-fraca);
      }

      .busca__campo:focus {
        outline: none;
        background: var(--fundo);
        border-color: var(--azul);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--azul) 18%, transparent);
      }

      .busca__campo::-webkit-search-cancel-button {
        cursor: pointer;
      }

      .dica {
        margin: 7px 0 0;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--tinta-fraca);
      }

      .dica b {
        color: var(--azul);
        font-weight: 500;
      }

      /* --- Resumo ----------------------------------------------------- */

      .resumo {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 9px 16px;
        background: var(--papel);
        border-bottom: 1px solid var(--linha);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--tinta-fraca);
      }

      .resumo strong {
        color: var(--tinta);
        font-weight: 600;
      }

      /* --- Lista de vendas -------------------------------------------- */

      .lista {
        margin: 0;
        padding: 0;
        list-style: none;
        flex: 1;
      }

      .venda {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 12px 16px 12px 19px;
        border-bottom: 1px solid var(--linha);
        animation: surgir 0.28s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }

      /* Espinha colorida pelo status — a única cor forte de cada linha. */
      .venda::before {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 0 2px 2px 0;
        background: var(--cor-status, var(--cinza));
      }

      .venda:nth-child(1) { animation-delay: 0.00s; }
      .venda:nth-child(2) { animation-delay: 0.03s; }
      .venda:nth-child(3) { animation-delay: 0.06s; }
      .venda:nth-child(4) { animation-delay: 0.09s; }
      .venda:nth-child(5) { animation-delay: 0.12s; }
      .venda:nth-child(6) { animation-delay: 0.15s; }
      .venda:nth-child(7) { animation-delay: 0.18s; }
      .venda:nth-child(8) { animation-delay: 0.21s; }
      .venda:nth-child(9) { animation-delay: 0.24s; }
      .venda:nth-child(10) { animation-delay: 0.27s; }

      @keyframes surgir {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .venda {
          animation: none;
        }
      }

      .venda__numero {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .venda__valor {
        grid-column: 2;
        grid-row: 1 / span 2;
        align-self: center;
        text-align: right;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .venda__meta {
        grid-column: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--tinta-fraca);
      }

      .venda__status {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: var(--sans);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        color: var(--cor-status, var(--cinza));
      }

      .venda__status::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }

      .venda__itens {
        grid-column: 1 / -1;
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--tinta-media);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* --- Esqueleto de carregamento ---------------------------------- */

      .esqueleto__linha {
        padding: 12px 16px 12px 19px;
        border-bottom: 1px solid var(--linha);
        display: grid;
        gap: 7px;
      }

      .barra {
        height: 9px;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          var(--papel) 0%,
          var(--linha) 50%,
          var(--papel) 100%
        );
        background-size: 200% 100%;
        animation: brilho 1.3s ease-in-out infinite;
      }

      .barra--curta { width: 34%; }
      .barra--media { width: 62%; }

      @keyframes brilho {
        to {
          background-position: -200% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .barra {
          animation: none;
        }
      }

      /* --- Avisos (sem contato, vazio, erro) --------------------------- */

      .aviso {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 48px 28px;
        text-align: center;
      }

      .aviso__icone {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        margin-bottom: 6px;
        border-radius: var(--raio);
        border: 1px solid var(--linha);
        background: var(--papel);
        color: var(--azul);
      }

      .aviso__icone svg {
        width: 19px;
        height: 19px;
      }

      .aviso__titulo {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }

      .aviso__texto {
        margin: 0;
        max-width: 30ch;
        font-size: 12px;
        color: var(--tinta-fraca);
      }

      .aviso__acao {
        margin-top: 10px;
      }

      /* --- Botões e paginação ------------------------------------------ */

      .botao {
        padding: 7px 13px;
        border: 1px solid var(--linha);
        border-radius: var(--raio-mini);
        background: var(--fundo);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          color 0.15s ease,
          background 0.15s ease;
      }

      .botao:hover:not(:disabled) {
        border-color: var(--azul);
        color: var(--azul);
        background: var(--azul-veu);
      }

      .botao:active:not(:disabled) {
        transform: translateY(1px);
      }

      .botao:focus-visible {
        outline: 2px solid var(--azul);
        outline-offset: 2px;
      }

      .botao:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .paginacao {
        position: sticky;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        background: var(--fundo);
        border-top: 1px solid var(--linha);
      }

      .paginacao__posicao {
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--tinta-fraca);
      }
    </style>
  </head>

  <body>
    <div class="painel">
      <header class="cabecalho">
        <p class="marca"><span class="marca__selo"></span>C-Plus 5 · Vendas</p>
        <div class="contato" data-secao="contato" hidden>
          <span class="contato__nome" data-campo="nomeContato"></span>
          <span class="contato__codigo" data-campo="codigoPessoa"></span>
        </div>
      </header>

      <div class="controles" data-secao="controles" hidden>
        <div class="busca">
          <svg class="busca__icone" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" />
            <path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <input
            class="busca__campo"
            data-campo="busca"
            type="search"
            autocomplete="off"
            placeholder="Número da venda ou produto"
            aria-label="Buscar vendas do contato"
          />
        </div>
        <p class="dica" data-campo="dicaBusca" hidden></p>
      </div>

      <div class="resumo" data-secao="resumo" hidden>
        <span data-campo="total"></span>
        <span>mais recentes primeiro</span>
      </div>

      <ul class="lista" data-secao="lista" hidden></ul>

      <div data-secao="esqueleto" hidden>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
        <div class="esqueleto__linha">
          <div class="barra barra--curta"></div>
          <div class="barra barra--media"></div>
        </div>
      </div>

      <div class="aviso" data-secao="aviso" aria-live="polite" hidden>
        <div class="aviso__icone">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M5 3h10v14l-2.5-1.5L10 17l-2.5-1.5L5 17V3Z"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linejoin="round"
            />
            <path
              d="M8 7h4M8 10h4"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="aviso__titulo" data-campo="avisoTitulo"></p>
        <p class="aviso__texto" data-campo="avisoTexto"></p>
        <button class="botao aviso__acao" data-acao="repetir" hidden>
          Tentar de novo
        </button>
      </div>

      <nav class="paginacao" data-secao="paginacao" hidden aria-label="Paginação">
        <button class="botao" data-acao="anterior" type="button">Anterior</button>
        <span class="paginacao__posicao" data-campo="posicao"></span>
        <button class="botao" data-acao="proxima" type="button">Próxima</button>
      </nav>
    </div>

    <!-- Modelo de uma linha da lista. Clonado em `renderizarVendas`. -->
    <template data-modelo="venda">
      <li class="venda">
        <span class="venda__numero" data-campo="numero"></span>
        <span class="venda__valor" data-campo="valor"></span>
        <span class="venda__meta">
          <span data-campo="data"></span>
          <span class="venda__status" data-campo="status"></span>
        </span>
        <p class="venda__itens" data-campo="itens"></p>
      </li>
    </template>

    <script src="plugin.js"></script>
  </body>
</html>
